name: MyMusic
options:
  bundleIdPrefix: com.personal
  developmentLanguage: he
  deploymentTarget:
    iOS: "17.0"
targets:
  MyMusic:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleDevelopmentRegion: he
        INAlternativeAppNames:
          - INAlternativeAppName: "מוזיקה שלי"
          - INAlternativeAppName: "המוזיקה"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.mymusic
        PRODUCT_NAME: MyMusic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "המוזיקה שלי"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
